<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Login Portal - WS Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(139,92,246,0.1) 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
        }

        .admin-login-box {
            background: rgba(15, 15, 30, 0.95);
            backdrop-filter: blur(35px);
            border: 2px solid rgba(236, 72, 153, 0.4);
            border-radius: 32px;
            padding: 42px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 35px 100px rgba(236, 72, 153, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .admin-badge-icon {
            width: 76px;
            height: 76px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(139,92,246,0.2));
            border: 2px solid #ec4899;
            color: #ec4899;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px auto;
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.5);
        }

        h2 { font-size: 24px; font-weight: 900; margin-bottom: 6px; color: #fff; letter-spacing: -0.5px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 28px; font-weight: 500; }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
        }
        .input-field:focus {
            border-color: #ec4899;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35);
            background: rgba(0,0,0,0.7);
        }

        .btn-admin-submit {
            width: 100%;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(236,72,153,0.4);
            margin-top: 10px;
            transition: all 0.25s ease;
        }
        .btn-admin-submit:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 16px 40px rgba(236,72,153,0.6);
        }

        .flash-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="admin-login-box">
        <div class="admin-badge-icon">
            <i class="fa-solid fa-crown"></i>
        </div>
        <h2>Master Admin Login</h2>
        <p>Exclusive Access for System Administrator</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/admin-login">
            <div class="input-group">
                <label><i class="fa-solid fa-user-shield" style="margin-right:4px;"></i> Master Admin Username</label>
                <input type="text" name="username" placeholder="Enter Admin Username" class="input-field" required autofocus autocomplete="off">
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock" style="margin-right:4px;"></i> Account Password</label>
                <input type="password" name="password" placeholder="••••••••••••" class="input-field" required>
            </div>

            <button type="submit" class="btn-admin-submit">
                <i class="fa-solid fa-shield-halved" style="margin-right: 6px;"></i> Direct Master Dashboard Access
            </button>
        </form>

        <a href="/" style="display: inline-block; margin-top: 24px; font-size: 13px; color: #94a3b8; text-decoration: none; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> Return to WS Chat
        </a>
    </div>

</body>
</html>
